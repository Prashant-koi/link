# HTTPS front for Link. The jonasal/nginx-certbot image owns port 80 (ACME
# challenge, then a 301 to HTTPS — see its built-in redirector.conf), and
# issues/renews the certificate named in ssl_certificate_key below for the
# server_name in this file. The certificate lives in the nginx_secrets
# volume, not in the repo.
server {
    listen 443 ssl default_server reuseport;
    listen [::]:443 ssl default_server reuseport;
    server_name linkmit.duckdns.org;

    ssl_certificate         /etc/letsencrypt/live/linkmit/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/linkmit/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/linkmit/chain.pem;
    ssl_dhparam             /etc/letsencrypt/dhparams/dhparam.pem;

    # Resume/LinkedIn imports arrive as base64 inside a JSON body, up to the
    # API's 12mb JSON limit; nginx's 1m default would answer those with 413.
    client_max_body_size 16m;

    # Docker's embedded DNS. With a variable in proxy_pass nginx resolves
    # "api" per request instead of once at startup, so nginx neither fails
    # to start when the API isn't up yet after a reboot, nor keeps a stale
    # address after the API container is recreated or restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # "api" is the compose service name, resolved on the internal network:
        # the API needs no host port at all for this to work.
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-sent events: buffering would hold events back until the buffer
    # fills, so the browser would see nothing. The read timeout outlives the
    # app's 25s heartbeat by a wide margin.
    location = /api/events {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Live co-editing: a WebSocket, so it needs the Upgrade handshake and a
    # long idle timeout (the provider pings, but quiet documents stay open).
    location = /collab {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
