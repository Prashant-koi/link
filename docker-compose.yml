services:
  postgres:
    image: pgvector/pgvector:pg16
    platform: linux/arm64
    # Without this the database stays down after a reboot, and api/worker
    # crash-loop against nothing.
    restart: unless-stopped
    # Loopback only — reachable from this machine, not from the network. The
    # worker runs on the host network (see below) so it can't use the compose
    # service name "postgres", and needs a host port to reach the database.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: link
      POSTGRES_USER: link
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U link -d link"]
      interval: 3s
      retries: 20

  # One-shot: runs migrations then exits. restart:"no" plus
  # service_completed_successfully means the API refuses to start against
  # an unmigrated database, and two replicas can never race applying the
  # same migration (deployment handoff, "App stack").
  migrate:
    build: .
    platform: linux/arm64
    command: npm run migrate
    depends_on:
      postgres: { condition: service_healthy }
    env_file: .env
    restart: "no"

  api:
    build: .
    platform: linux/arm64
    command: npm run start:api
    depends_on:
      migrate: { condition: service_completed_successfully }
    env_file: .env
    # Ollama runs in the separate model stack, reached via the host — see
    # docker-compose.model.yml. Linux doesn't map host.docker.internal
    # automatically, hence this.
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Uploaded workspace files (text files live in Postgres).
    environment:
      WORKSPACE_DIR: /data/workspaces
      # The API answers AI questions itself, so it needs the model too. Ollama
      # only listens on the host's loopback; ollama-relay (below) exposes it on
      # the docker bridge address only.
      LLM_BASE_URL: http://host.docker.internal:11435
    volumes:
      - workspace_files:/data/workspaces
    ports:
      - "127.0.0.1:3000:3000" # tunnelled, never bound to 0.0.0.0 — see the deployment handoff, "Never expose"
    restart: unless-stopped

  # Forwards the docker bridge address (172.17.0.1:11435, reachable from
  # containers, not from the LAN) to Ollama on the host's loopback. Needed
  # because Ollama binds 127.0.0.1 only and the API container is not on the host
  # network. Uses the app image so nothing extra is pulled.
  ollama-relay:
    build: .
    platform: linux/arm64
    network_mode: host
    restart: unless-stopped
    environment:
      RELAY_BIND: "172.17.0.1"
      RELAY_PORT: "11435"
      RELAY_TARGET_PORT: "11434"
    command:
      - node
      - -e
      - |
        const net = require("net");
        const bind = process.env.RELAY_BIND, port = Number(process.env.RELAY_PORT), target = Number(process.env.RELAY_TARGET_PORT);
        net.createServer((c) => {
          const u = net.connect(target, "127.0.0.1");
          c.pipe(u).pipe(c);
          c.on("error", () => u.destroy());
          u.on("error", () => c.destroy());
        }).listen(port, bind, () => console.log("relay " + bind + ":" + port + " -> 127.0.0.1:" + target));

  # TLS terminates here, so the site is served at https://<domain> with no
  # port in the URL. Owns 80 (ACME challenge + redirect to HTTPS) and 443;
  # proxies to api over the internal network. Config lives in
  # nginx/user_conf.d/, and the certificate in the nginx_secrets volume.
  nginx:
    image: jonasal/nginx-certbot:latest
    platform: linux/arm64
    restart: unless-stopped
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
      # 1 = sign with a throwaway local CA instead of asking Let's Encrypt
      # (browsers will warn). Only for the window before DNS points at this
      # machine's public IP and 80/443 are forwarded — see .env.example.
      USE_LOCAL_CA: ${USE_LOCAL_CA:-0}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_secrets:/etc/letsencrypt
      - ./nginx/user_conf.d:/etc/nginx/user_conf.d:ro
    depends_on:
      - api

  # The only process (with the seeder and reprocess script) that talks to the
  # model. Ollama runs natively on this host bound to 127.0.0.1 — the docker
  # runtime here has no NVIDIA support, so docker-compose.model.yml can't be
  # used — and a bridge-network container can't reach a loopback-only service.
  # Host networking is the way in that needs neither root nor rebinding
  # Ollama (which has no auth) onto the venue network.
  worker:
    build: .
    platform: linux/arm64
    command: npm run start:worker
    network_mode: host
    depends_on:
      migrate: { condition: service_completed_successfully }
    env_file: .env
    environment:
      DATABASE_URL: postgres://link:${POSTGRES_PASSWORD}@127.0.0.1:5432/link
      LLM_BASE_URL: http://127.0.0.1:11434
    restart: unless-stopped

  # Ingest is on-demand/batch (backend handoff's runtime-roles table), not a
  # long-running service — run ad hoc:
  #   docker compose run --rm ingest-worker path/to/batch.jsonl
  ingest-worker:
    build: .
    platform: linux/arm64
    command: npm run start:ingest-worker
    env_file: .env
    profiles: ["tools"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  workspace_files:
  nginx_secrets:
