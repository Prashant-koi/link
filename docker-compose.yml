services:
  neo4j:
    image: neo4j:5.26-community
    container_name: studentos-neo4j
    ports:
      - "7474:7474" # browser
      - "7687:7687" # bolt
    environment:
      NEO4J_AUTH: neo4j/studentos
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - ./neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "studentos", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 20
